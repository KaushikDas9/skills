<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Lantern Bean - Neo-Brutalism</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo Local";
        src: url("assets/Archivo.ttf") format("truetype");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-style: normal;
      }
      @font-face {
        font-family: "Space Mono Local";
        src: url("assets/SpaceMono-Bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
      }
      :root {
        --ink: #000000;
        --paper: #fff6e5;
        --white: #ffffff;
        --yellow: #ffd23f;
        --pink: #ff8fd6;
        --lime: #b8f15a;
        --blue: #7aa2ff;
        --orange: #ff7a45;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: var(--paper);
        background-image: radial-gradient(circle, rgba(0, 0, 0, 0.2) 2px, transparent 2.6px);
        background-size: 30px 30px;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Archivo Local", sans-serif;
        color: var(--ink);
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Hard-shadow block: a flat black slab offset behind a face that can press onto it */
      .slab {
        position: relative;
        display: inline-block;
      }
      .slab .shadow {
        position: absolute;
        inset: 0;
        background: var(--ink);
        transform: translate(14px, 14px);
      }
      .slab .face {
        position: relative;
        border: 6px solid var(--ink);
        font-weight: 900;
        font-stretch: 125%;
        line-height: 1;
        white-space: nowrap;
      }

      /* Scene 1: hero */
      #hero-stack {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 72px;
      }
      #lantern .face {
        background: var(--pink);
        font-size: 268px;
        padding: 34px 74px 40px;
      }
      #bean .face {
        background: var(--yellow);
        font-size: 268px;
        padding: 34px 74px 40px;
      }

      /* Scene 2: cup */
      #card-blue {
        position: absolute;
        left: 1010px;
        top: 150px;
        width: 814px;
        height: 790px;
        background: var(--blue);
        border: 6px solid var(--ink);
        box-shadow: 14px 14px 0 var(--ink);
      }
      #cup {
        position: absolute;
        left: 1110px;
        top: 230px;
        width: 620px;
        height: 660px;
        overflow: visible;
        filter: drop-shadow(16px 16px 0 #000);
      }
      #steam path {
        fill: none;
        stroke: var(--ink);
        stroke-width: 14;
        stroke-linecap: round;
        stroke-dasharray: 1;
      }
      #line-card {
        position: absolute;
        left: 96px;
        top: 318px;
      }
      #line-card .face {
        background: var(--white);
        font-size: 96px;
        padding: 40px 48px 44px;
        line-height: 1.02;
      }
      #line-card .l1,
      #line-card .l2 {
        display: block;
      }
      #tag {
        position: absolute;
        left: 96px;
        top: 740px;
      }
      #tag .face {
        background: var(--pink);
        font-size: 60px;
        padding: 16px 30px 18px;
      }

      /* Style label */
      #style-label {
        position: absolute;
        top: 64px;
        right: 96px;
        font-family: "Space Mono Local", monospace;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.02em;
        color: var(--ink);
        background: var(--yellow);
        border: 4px solid var(--ink);
        box-shadow: 6px 6px 0 var(--ink);
        padding: 10px 20px 12px;
        line-height: 1;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <section id="scene-hero" class="clip" data-start="0" data-duration="1.8" data-track-index="0">
        <div id="hero-stack">
          <div id="lantern" class="slab">
            <div class="shadow"></div>
            <div class="face">Lantern</div>
          </div>
          <div id="bean" class="slab">
            <div class="shadow"></div>
            <div class="face">Bean</div>
          </div>
        </div>
      </section>

      <section id="scene-cup" class="clip" data-start="1.8" data-duration="3.2" data-track-index="1">
        <div id="card-blue"></div>

        <svg id="cup" viewBox="0 0 600 640" aria-label="Coffee cup">
          <g id="steam">
            <path d="M226 128 C 200 104, 252 88, 226 62 C 206 42, 240 30, 232 14" pathLength="1" />
            <path d="M300 122 C 274 98, 326 82, 300 56 C 280 36, 314 24, 306 8" pathLength="1" />
            <path d="M374 128 C 348 104, 400 88, 374 62 C 354 42, 388 30, 380 14" pathLength="1" />
          </g>
          <!-- saucer, centred under the body -->
          <ellipse cx="300" cy="566" rx="262" ry="44" fill="#B8F15A" stroke="#000" stroke-width="10" />
          <!-- handle: black outline first, yellow fill on top; ends sit inside the body -->
          <path d="M440 268 C 566 232, 596 404, 436 430" fill="none" stroke="#000" stroke-width="66" stroke-linecap="round" />
          <path d="M440 268 C 566 232, 596 404, 436 430" fill="none" stroke="#FFD23F" stroke-width="40" stroke-linecap="round" />
          <!-- body -->
          <path d="M126 196 L474 196 L444 466 Q438 524 380 524 L220 524 Q162 524 156 466 Z" fill="#FFD23F" stroke="#000" stroke-width="10" stroke-linejoin="round" />
          <!-- rim and coffee surface -->
          <ellipse cx="300" cy="196" rx="174" ry="36" fill="#FFF6E5" stroke="#000" stroke-width="10" />
          <ellipse cx="300" cy="200" rx="136" ry="20" fill="#000" />
        </svg>

        <div id="line-card" class="slab">
          <div class="shadow"></div>
          <div class="face">
            <span class="l1">Fresh coffee,</span>
            <span class="l2">every morning</span>
          </div>
        </div>

        <div id="tag" class="slab">
          <div class="shadow"></div>
          <div class="face" id="tag-face">Lantern Bean</div>
        </div>
      </section>

      <div id="style-label">Neo-Brutalism</div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Scene 1: hero slam, press, exit
      tl.fromTo("#lantern", { y: -40 }, { y: 0, duration: 0.35, ease: "back.out(2)" }, 0)
        .fromTo("#bean", { y: -40 }, { y: 0, duration: 0.35, ease: "back.out(2)" }, 0.15)
        .to(["#lantern .face", "#bean .face"], { x: 14, y: 14, duration: 0.1, ease: "linear" }, 1.05)
        .to(["#lantern .face", "#bean .face"], { x: 0, y: 0, duration: 0.1, ease: "linear" }, 1.2)
        .to("#hero-stack", { y: -900, duration: 0.25, ease: "power3.in" }, 1.5);

      // Scene 2: cup, line, name (all in place by 2.8 s)
      tl.fromTo("#card-blue", { y: -120 }, { y: 0, duration: 0.4, ease: "back.out(1.8)" }, 1.8)
        .fromTo("#cup", { y: -300 }, { y: 0, duration: 0.5, ease: "back.out(1.5)" }, 1.9)
        .fromTo("#line-card", { x: -160 }, { x: 0, duration: 0.45, ease: "back.out(1.8)" }, 2.0)
        .fromTo(".l1", { y: 40 }, { y: 0, duration: 0.3, ease: "power3.out" }, 2.15)
        .fromTo(".l2", { y: 40 }, { y: 0, duration: 0.3, ease: "power3.out" }, 2.3)
        .fromTo("#steam path", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power1.out", stagger: 0.08 }, 2.3)
        .fromTo("#tag", { scale: 0.5, rotation: -12 }, { scale: 1, rotation: -3, duration: 0.35, ease: "back.out(2.2)" }, 2.5);

      // Gentle style movement after 2.8 s
      tl.to("#steam", { y: -8, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.0)
        .to("#tag-face", { x: 14, y: 14, duration: 0.1, ease: "linear" }, 3.6)
        .to("#tag-face", { x: 0, y: 0, duration: 0.1, ease: "linear" }, 3.75);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
