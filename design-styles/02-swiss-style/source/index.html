<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "TeX Gyre Heros SW";
        src: url("assets/texgyreheros-regular.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "TeX Gyre Heros SW";
        src: url("assets/texgyreheros-bold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
      }
      :root {
        --paper: #f5f4f0;
        --ink: #111111;
        --red: #e30613;
        --grey: #7a7a78;
        --font-display: "TeX Gyre Heros SW", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        font-family: var(--font-display);
        color: var(--ink);
      }
      .abs {
        position: absolute;
      }
      /* 12-column grid at 1920x1080: margin 96, module 122, gutter 24 (col n starts at 96 + 146n) */
      .rule {
        left: 96px;
        top: 114px;
        width: 1728px;
        height: 3px;
        background: var(--ink);
        transform-origin: left center;
      }
      .label {
        left: 96px;
        top: 922px;
        font-size: 28px;
        font-weight: 700;
        line-height: 1;
        color: var(--grey);
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      .hero {
        left: 96px;
        font-size: 280px;
        font-weight: 700;
        line-height: 0.86;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      .block-red {
        background: var(--red);
      }
      .line {
        white-space: nowrap;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <!-- Persistent: hairline rule and style label -->
      <div class="abs clip" data-start="0" data-duration="5" data-track-index="0" style="left:0;top:0;width:1920px;height:1080px;pointer-events:none;">
        <div id="rule" class="abs rule"></div>
        <div id="label" class="abs label">Swiss Style</div>
      </div>

      <!-- Scene 1 (0.0 - 1.6 s): hero name -->
      <div class="abs clip" data-start="0" data-duration="1.6" data-track-index="1" style="left:0;top:0;width:1920px;height:1080px;">
        <div id="s1" class="abs" style="left:0;top:0;width:1920px;height:1080px;">
          <div id="hero1" class="abs hero" style="top:290px;">Lantern</div>
          <div id="hero2" class="abs hero" style="top:531px;">Bean</div>
          <div id="red1" class="abs block-red" style="left:1264px;top:114px;width:560px;height:270px;"></div>
        </div>
      </div>

      <!-- Scene 2 (1.6 - 3.4 s): cup and line -->
      <div class="abs clip" data-start="1.6" data-duration="1.8" data-track-index="2" style="left:0;top:0;width:1920px;height:1080px;">
        <div id="s2" class="abs" style="left:0;top:0;width:1920px;height:1080px;">
          <div id="s2a" class="abs line" style="left:96px;top:406px;font-size:104px;line-height:1;">Fresh coffee,</div>
          <div id="s2b" class="abs line" style="left:96px;top:510px;font-size:104px;line-height:1;">every morning</div>
          <svg id="cup" class="abs" style="left:1000px;top:280px;" width="640" height="580" viewBox="0 0 640 580" aria-label="Coffee cup">
            <!-- saucer -->
            <ellipse cx="290" cy="468" rx="250" ry="34" fill="#111111" />
            <!-- handle (behind body) -->
            <path d="M452 262 C 575 236 588 404 440 382" fill="none" stroke="#111111" stroke-width="28" />
            <!-- body -->
            <path d="M110 220 L 470 220 L 440 430 Q 430 462 396 462 L 184 462 Q 150 462 140 430 Z" fill="#e30613" />
            <!-- rim -->
            <ellipse cx="290" cy="220" rx="180" ry="26" fill="#111111" />
            <!-- coffee surface -->
            <ellipse cx="290" cy="222" rx="158" ry="15" fill="#7a7a78" />
            <!-- steam -->
            <g fill="none" stroke="#7a7a78" stroke-width="10" stroke-linecap="round">
              <path class="steam" d="M220 150 C 198 120 242 100 220 60" stroke-dasharray="240" stroke-dashoffset="240" />
              <path class="steam" d="M292 140 C 270 108 314 86 292 36" stroke-dasharray="240" stroke-dashoffset="240" />
              <path class="steam" d="M364 150 C 342 120 386 100 364 60" stroke-dasharray="240" stroke-dashoffset="240" />
            </g>
          </svg>
        </div>
      </div>

      <!-- Scene 3 (3.4 - 5.0 s): call to action with name -->
      <div class="abs clip" data-start="3.4" data-duration="1.6" data-track-index="3" style="left:0;top:0;width:1920px;height:1080px;">
        <div id="s3" class="abs" style="left:0;top:0;width:1920px;height:1080px;">
          <div id="s3name" class="abs line" style="left:96px;top:138px;font-size:56px;line-height:1;">Lantern Bean</div>
          <div id="s3a" class="abs line" style="left:96px;top:330px;font-size:150px;line-height:0.95;">Come in,</div>
          <div id="s3b" class="abs line" style="left:96px;top:473px;font-size:150px;line-height:0.95;">warm up.</div>
          <div id="red2" class="abs block-red" style="left:1264px;top:552px;width:560px;height:292px;"></div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EASE = "power3.out";

      // Persistent elements
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: EASE }, 0);
      tl.fromTo("#label", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.2);

      // Scene 1: the hero is visible on frame 0 (offset, not empty)
      tl.fromTo("#hero1", { y: 40 }, { y: 0, duration: 0.6, ease: EASE }, 0);
      tl.fromTo("#hero2", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: EASE }, 0.12);
      tl.fromTo("#red1", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.5, ease: EASE }, 0.15);
      tl.to("#s1", { opacity: 0, duration: 0.3, ease: "power2.in" }, 1.25);

      // Scene 2: line and cup
      tl.fromTo("#s2a", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: EASE }, 1.7);
      tl.fromTo("#s2b", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: EASE }, 1.82);
      tl.fromTo("#cup", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: EASE }, 1.7);
      tl.fromTo(".steam", { strokeDashoffset: 240 }, { strokeDashoffset: 0, duration: 0.7, ease: "power1.out", stagger: 0.1 }, 2.1);
      tl.to("#s2", { opacity: 0, duration: 0.2, ease: "none" }, 3.2);

      // Scene 3: call to action and name
      tl.fromTo("#red2", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: EASE }, 3.4);
      tl.fromTo("#s3name", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 3.4);
      tl.fromTo("#s3a", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: EASE }, 3.45);
      tl.fromTo("#s3b", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: EASE }, 3.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
