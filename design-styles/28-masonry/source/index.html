<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/InstrumentSerif-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
      }
      :root {
        --paper: #f2efe9;
        --card: #ffffff;
        --ink: #141414;
        --ink-2: #6f6a62;
        --night: #0d0e10;
        --night-2: #17181b;
        --accent: #f2462e;
        --sand: #e9e2d3;
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "Inter", Arial, sans-serif;
        --col: 417px;
        --gap: 20px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--paper);
        overflow: hidden;
      }
      .clip {
        position: absolute;
      }
      #label {
        left: 96px;
        top: 56px;
        font-family: var(--sans);
        font-weight: 500;
        font-size: 28px;
        letter-spacing: 0.04em;
        color: var(--ink-2);
        white-space: nowrap;
      }
      #hero {
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #hero-name {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 230px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--ink);
        white-space: nowrap;
      }
      .cell {
        width: var(--col);
      }
      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        border-radius: 20px;
        overflow: hidden;
        background: var(--card);
      }
      .sh {
        position: absolute;
      }
      .c-ink {
        background: var(--ink);
      }
      .c-accent {
        background: var(--accent);
      }
      .c-sand {
        background: var(--sand);
      }
      .c-night {
        background: var(--night);
      }
      .circle {
        border-radius: 50%;
      }
      #featured-face {
        position: absolute;
        inset: 0;
      }
      #cup-svg {
        position: absolute;
        left: 440px;
        top: 40px;
        width: 400px;
        height: 347px;
      }
      #feat-text {
        position: absolute;
        left: 40px;
        width: 380px;
        bottom: 40px;
      }
      #feat-line {
        font-family: var(--serif);
        font-size: 60px;
        line-height: 1.02;
        color: var(--ink);
      }
      #feat-name {
        margin-top: 18px;
        font-family: var(--sans);
        font-weight: 500;
        font-size: 36px;
        letter-spacing: 0.02em;
        color: var(--ink-2);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="label" class="clip" data-start="0" data-duration="5" data-track-index="2">Masonry</div>

      <div id="hero" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="hero-name">Lantern Bean</div>
      </div>

      <!-- Masonry cards: placement (column and y) is computed in script from data-ratio (height / width), in source order, shortest column first. -->
      <div class="clip cell" data-card data-ratio="0.5625" data-start="0" data-duration="5" data-track-index="1">
        <div class="card c-ink">
          <div data-layout-allow-overflow class="sh circle" style="width:220px;height:220px;right:-70px;bottom:-120px;background:var(--accent)"></div>
          <div data-layout-allow-overflow class="sh" style="left:40px;top:40px;width:56px;height:6px;background:var(--sand)"></div>
        </div>
      </div>

      <div class="clip cell" data-card data-span="2" data-col="1" data-h="560" data-ratio="1.25" data-start="0" data-duration="5" data-track-index="1">
        <div class="card" id="featured">
          <div id="featured-face">
            <svg id="cup-svg" viewBox="0 0 300 260" aria-hidden="true">
              <g id="cup">
                <ellipse cx="150" cy="222" rx="128" ry="14" fill="#e9e2d3" />
                <path d="M78 104 H222 L206 196 Q202 216 180 216 H120 Q98 216 94 196 Z" fill="#141414" />
                <rect x="72" y="96" width="156" height="14" rx="7" fill="#0d0e10" />
                <path d="M219 126 C262 118 270 172 220 182" fill="none" stroke="#141414" stroke-width="16" stroke-linecap="round" />
                <rect x="93" y="150" width="114" height="8" rx="4" fill="#f2462e" />
              </g>
              <g id="steam" fill="none" stroke="#6f6a62" stroke-width="4" stroke-linecap="round">
                <path d="M124 86 C111 68 137 58 124 36" />
                <path d="M150 82 C137 62 163 52 150 24" />
                <path d="M176 86 C163 68 189 58 176 36" />
              </g>
            </svg>
            <div id="feat-text">
              <div id="feat-line">Fresh coffee,<br />every morning</div>
              <div id="feat-name">Lantern Bean</div>
            </div>
          </div>
        </div>
      </div>

      <div class="clip cell" data-card data-ratio="1" data-start="0" data-duration="5" data-track-index="1">
        <div class="card">
          <div data-layout-allow-overflow class="sh circle" style="left:-90px;bottom:-90px;width:300px;height:300px;border:3px solid var(--sand)"></div>
          <div data-layout-allow-overflow class="sh circle" style="left:-40px;bottom:-40px;width:200px;height:200px;border:3px solid var(--sand)"></div>
          <div data-layout-allow-overflow class="sh circle" style="right:36px;top:36px;width:26px;height:26px;background:var(--accent)"></div>
        </div>
      </div>

      <div class="clip cell" data-card data-ratio="0.6667" data-start="0" data-duration="5" data-track-index="1">
        <div class="card c-sand">
          <div data-layout-allow-overflow class="sh" style="left:-80px;bottom:-80px;width:200px;height:200px;border-radius:0 100% 0 0;background:var(--ink)"></div>
          <div data-layout-allow-overflow class="sh" style="right:40px;top:40px;width:70px;height:18px;background:var(--accent)"></div>
        </div>
      </div>

      <div class="clip cell" data-card data-ratio="0.75" data-start="0" data-duration="5" data-track-index="1">
        <div class="card c-accent">
          <div data-layout-allow-overflow class="sh circle" style="left:50%;bottom:-170px;margin-left:-170px;width:340px;height:340px;background:var(--card)"></div>
          <div data-layout-allow-overflow class="sh circle" style="left:40px;top:40px;width:24px;height:24px;background:var(--ink)"></div>
        </div>
      </div>

      <div class="clip cell" data-card data-ratio="1.3333" data-start="0" data-duration="5" data-track-index="1">
        <div class="card c-night">
          <div data-layout-allow-overflow class="sh" style="left:0;right:0;top:0;bottom:0;background:repeating-linear-gradient(0deg, transparent 0 34px, var(--night-2) 34px 36px)"></div>
          <div data-layout-allow-overflow class="sh" style="left:40px;top:40px;width:64px;height:64px;background:var(--accent)"></div>
        </div>
      </div>

      <div class="clip cell" data-card data-ratio="0.5625" data-start="0" data-duration="5" data-track-index="1">
        <div class="card">
          <div data-layout-allow-overflow class="sh" style="left:40px;bottom:0;width:48px;height:150px;background:var(--sand);border-radius:24px 24px 0 0"></div>
          <div data-layout-allow-overflow class="sh" style="left:108px;bottom:0;width:48px;height:96px;background:var(--ink);border-radius:24px 24px 0 0"></div>
          <div data-layout-allow-overflow class="sh" style="left:176px;bottom:0;width:48px;height:190px;background:var(--accent);border-radius:24px 24px 0 0"></div>
        </div>
      </div>

      <div class="clip cell" data-card data-ratio="0.5625" data-start="0" data-duration="5" data-track-index="1">
        <div class="card c-sand">
          <div data-layout-allow-overflow class="sh circle" style="left:40px;top:50%;margin-top:-50px;width:100px;height:100px;background:var(--ink)"></div>
          <div data-layout-allow-overflow class="sh" style="right:40px;top:50%;margin-top:-6px;width:140px;height:12px;background:var(--accent)"></div>
        </div>
      </div>

      <div class="clip cell" data-card data-ratio="0.6667" data-start="0" data-duration="5" data-track-index="1">
        <div class="card">
          <div data-layout-allow-overflow class="sh" style="left:50%;top:-60px;margin-left:-60px;width:120px;height:120px;border-radius:0 0 120px 120px;background:var(--accent)"></div>
          <div data-layout-allow-overflow class="sh" style="left:40px;bottom:40px;width:120px;height:14px;background:var(--sand)"></div>
        </div>
      </div>
    </div>

    <script>
      const COL_W = 417;
      const GAP = 20;
      const GRID_X = 96;
      const GRID_Y = 128;
      const COLS = 4;

      // Masonry placement: each card goes into the currently shortest column (ties: left to right).
      const colBottom = new Array(COLS).fill(0);
      const cards = Array.from(document.querySelectorAll("[data-card]"));
      cards.forEach((el) => {
        const span = parseInt(el.dataset.span || "1", 10);
        // regular cards are scaled to 75% height so the wide featured card still fits the frame
        const h = el.dataset.h ? parseInt(el.dataset.h, 10) : Math.round(COL_W * parseFloat(el.dataset.ratio) * 0.75);
        let c = 0;
        let y = 0;
        if (span > 1) {
          // wide card: fixed column pair at the top, both columns pushed down together
          c = parseInt(el.dataset.col, 10);
          y = Math.max(...colBottom.slice(c, c + span));
          for (let i = c; i < c + span; i++) colBottom[i] = y + h + GAP;
        } else {
          for (let i = 1; i < COLS; i++) {
            if (colBottom[i] < colBottom[c]) c = i;
          }
          y = colBottom[c];
          colBottom[c] = y + h + GAP;
        }
        el.style.left = GRID_X + c * (COL_W + GAP) + "px";
        el.style.top = GRID_Y + y + "px";
        el.style.width = span * COL_W + (span - 1) * GAP + "px";
        el.style.height = h + "px";
      });

      const cardFaces = cards.map((el) => el.querySelector(".card"));
      const featuredIndex = cards.findIndex((el) => el.querySelector("#featured"));

      const tl = gsap.timeline({ paused: true });

      // 0.0 to 1.8 s: the shop name is the hero.
      tl.fromTo("#hero-name", { y: 14 }, { y: 0, duration: 0.8, ease: "power3.out" }, 0);
      tl.fromTo("#hero", { opacity: 1 }, { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, 1.5);

      // 1.8 to 2.8 s: cards land in placement order.
      cardFaces.forEach((face, i) => {
        const t = 1.8 + i * 0.07;
        tl.fromTo(face, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, t);
      });
      tl.fromTo("#label", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.8);

      // Featured card content: cup, then line, then name, all in place by 2.8 s.
      tl.fromTo("#cup", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.1);
      tl.fromTo("#steam", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.3);
      tl.fromTo("#feat-line", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.3);
      tl.fromTo("#feat-name", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.5);

      // 2.8 to 5.0 s: gentle movement only.
      cardFaces.forEach((face, i) => {
        if (i === featuredIndex) return;
        const amp = i % 2 === 0 ? -6 : -4;
        tl.to(face, { y: amp, duration: 2.2, ease: "sine.inOut" }, 2.8);
      });
      tl.to("#featured", { y: -4, duration: 2.2, ease: "sine.inOut" }, 2.8);
      tl.to("#steam", { opacity: 0.5, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.8);
      tl.to("#cup", { y: -3, duration: 2.2, ease: "sine.inOut" }, 2.8);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
