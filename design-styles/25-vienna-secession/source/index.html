<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Josefin Sans";
        src: url("assets/fonts/JosefinSans-Variable.ttf") format("truetype");
        font-weight: 100 700;
        font-style: normal;
      }
      :root {
        --ground: #121110;
        --ink: #121110;
        --paper: #f2ede2;
        --gold: #c99a2e;
        --bole: #6e2a17;
        --font-display: "Josefin Sans", "Futura", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
        color: var(--paper);
      }
      /* Gold hairline frame and two-row checkerboard bands */
      #frame {
        position: absolute;
        inset: 24px;
        border: 2px solid var(--gold);
      }
      .fc {
        position: absolute;
        width: 16px;
        height: 16px;
        background: var(--gold);
      }
      .band {
        position: absolute;
        left: 48px;
        width: 1824px;
        height: 32px;
        background-image: conic-gradient(
          var(--paper) 25%,
          var(--ink) 0 50%,
          var(--paper) 0 75%,
          var(--ink) 0
        );
        background-size: 32px 32px;
      }
      #band-top {
        top: 40px;
      }
      #band-bottom {
        top: 1008px;
      }
      #orn {
        position: absolute;
        left: 48px;
        top: 112px;
        width: 1824px;
        height: 28px;
        overflow: visible;
      }
      /* Scene A: hero */
      #hero {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #hero-name {
        font-size: 236px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.01em;
        color: var(--paper);
        white-space: nowrap;
      }
      .ch {
        display: inline-block;
        white-space: pre;
      }
      #hero-name .gold {
        color: var(--gold);
      }
      #hero-rule {
        width: 220px;
        height: 4px;
        margin-top: 44px;
        background: var(--gold);
      }
      /* Scene B: square panel and copy */
      #panel {
        position: absolute;
        left: 150px;
        top: 180px;
        width: 720px;
        height: 720px;
        padding: 16px;
        background: var(--paper);
      }
      #panel-ink {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ink);
        overflow: hidden;
      }
      #panel-frame {
        position: absolute;
        inset: 24px;
        border: 2px solid var(--gold);
      }
      #cup {
        position: absolute;
        left: 74px;
        top: 119px;
        width: 540px;
        height: 450px;
        overflow: visible;
      }
      #copy {
        position: absolute;
        left: 960px;
        top: 0;
        width: 840px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .tl-big {
        font-size: 104px;
        font-weight: 600;
        line-height: 1.08;
        color: var(--paper);
        white-space: nowrap;
      }
      #copy-rule {
        width: 120px;
        height: 4px;
        margin: 40px 0 36px;
        background: var(--gold);
        transform-origin: 0 50%;
      }
      #name {
        font-size: 52px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--gold);
      }
      /* Style label, inside the frame */
      #style-label {
        position: absolute;
        right: 96px;
        bottom: 96px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .steam {
        fill: none;
        stroke: var(--gold);
        stroke-width: 9;
        stroke-linecap: round;
        stroke-dasharray: 1 1;
        stroke-dashoffset: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="frame"></div>
      <div class="fc" style="left: 16px; top: 16px"></div>
      <div class="fc" style="left: 1888px; top: 16px"></div>
      <div class="fc" style="left: 16px; top: 1048px"></div>
      <div class="fc" style="left: 1888px; top: 1048px"></div>
      <div id="band-top" class="band"></div>
      <div id="band-bottom" class="band"></div>

      <svg id="orn" viewBox="0 0 1824 28" class="orn-row">
        <rect class="orn" x="103" y="3" width="22" height="22" fill="#c99a2e" />
        <circle class="orn" cx="342" cy="14" r="10" fill="none" stroke="#c99a2e" stroke-width="3" />
        <rect class="orn" x="331" y="3" width="22" height="22" fill="#c99a2e" />
        <circle class="orn" cx="570" cy="14" r="10" fill="none" stroke="#c99a2e" stroke-width="3" />
        <rect class="orn" x="559" y="3" width="22" height="22" fill="#c99a2e" />
        <circle class="orn" cx="798" cy="14" r="10" fill="none" stroke="#c99a2e" stroke-width="3" />
        <rect class="orn" x="787" y="3" width="22" height="22" fill="#c99a2e" />
        <circle class="orn" cx="1026" cy="14" r="10" fill="none" stroke="#c99a2e" stroke-width="3" />
        <rect class="orn" x="1015" y="3" width="22" height="22" fill="#c99a2e" />
        <circle class="orn" cx="1254" cy="14" r="10" fill="none" stroke="#c99a2e" stroke-width="3" />
        <rect class="orn" x="1243" y="3" width="22" height="22" fill="#c99a2e" />
        <circle class="orn" cx="1482" cy="14" r="10" fill="none" stroke="#c99a2e" stroke-width="3" />
        <rect class="orn" x="1471" y="3" width="22" height="22" fill="#c99a2e" />
        <circle class="orn" cx="1710" cy="14" r="10" fill="none" stroke="#c99a2e" stroke-width="3" />
      </svg>

      <div id="hero">
        <div id="hero-name"><span>Lantern</span> <span class="gold">Bean</span></div>
        <div id="hero-rule"></div>
      </div>

      <div id="panel">
        <div id="panel-ink">
          <div id="panel-frame"></div>
          <div class="fc" style="left: 12px; top: 12px; background: var(--paper)"></div>
          <div class="fc" style="left: 660px; top: 12px; background: var(--paper)"></div>
          <div class="fc" style="left: 12px; top: 660px; background: var(--paper)"></div>
          <div class="fc" style="left: 660px; top: 660px; background: var(--paper)"></div>
          <svg id="cup" viewBox="0 0 600 500">
            <!-- steam above the mouth -->
            <g id="steam-group">
              <path class="steam" pathLength="1" d="M230 128 C205 98 255 78 230 42" />
              <path class="steam" pathLength="1" d="M300 116 C275 84 325 62 300 22" />
              <path class="steam" pathLength="1" d="M370 128 C345 98 395 78 370 42" />
            </g>
            <!-- saucer, centred under the cup -->
            <g id="saucer">
              <ellipse cx="300" cy="438" rx="262" ry="40" fill="#f2ede2" stroke="#c99a2e" stroke-width="5" />
              <ellipse cx="300" cy="436" rx="180" ry="22" fill="#d9d2c2" />
            </g>
            <!-- handle, drawn first so the body overlaps its root -->
            <path id="handle" d="M462 214 C548 200 566 330 440 332" fill="none" stroke="#f2ede2" stroke-width="30" />
            <!-- body -->
            <path id="body" d="M120 170 L480 170 C480 326 420 412 300 412 C180 412 120 326 120 170 Z" fill="#f2ede2" />
            <path id="band" d="M124 236 Q300 268 476 236" fill="none" stroke="#c99a2e" stroke-width="12" />
            <!-- coffee surface and rim -->
            <ellipse id="rim" cx="300" cy="170" rx="180" ry="20" fill="#6e2a17" stroke="#c99a2e" stroke-width="6" />
          </svg>
        </div>
      </div>

      <div id="copy">
        <div class="tl-big line1">Fresh coffee,</div>
        <div class="tl-big line2">every morning</div>
        <div id="copy-rule"></div>
        <div id="name">Lantern Bean</div>
      </div>

      <div id="style-label">Vienna Secession</div>
    </div>
    <script>
      // Split the hero name into letters for the rise-in.
      (function () {
        const host = document.getElementById("hero-name");
        const parts = host.querySelectorAll("span");
        parts.forEach(function (sp) {
          const txt = sp.textContent;
          sp.textContent = "";
          for (const ch of txt) {
            const s = document.createElement("span");
            s.className = "ch";
            s.textContent = ch;
            sp.appendChild(s);
          }
        });
      })();

      const tl = gsap.timeline({ paused: true });

      // Scene A: hero, 0.0 to 1.8 s
      tl.fromTo(".orn", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out", stagger: 0.04, transformOrigin: "50% 50%" }, 0.05);
      tl.fromTo(".ch", { yPercent: 55, opacity: 0.2 }, { yPercent: 0, opacity: 1, duration: 0.6, ease: "power4.out", stagger: 0.03 }, 0.05);
      tl.fromTo("#hero-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out", transformOrigin: "50% 50%" }, 0.7);
      tl.to("#hero", { opacity: 0, yPercent: -6, duration: 0.3, ease: "power2.in" }, 1.6);

      // Scene B: cup and copy, 1.8 to 2.8 s, then a gentle hold
      tl.fromTo("#panel", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out", transformOrigin: "50% 50%" }, 1.8);
      tl.fromTo("#saucer", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.9);
      tl.fromTo("#body", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.0);
      tl.fromTo("#handle", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 2.15);
      tl.fromTo("#band", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.3);
      tl.fromTo("#rim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.3);
      tl.fromTo(".steam", { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.45, ease: "power1.inOut", stagger: 0.08 }, 2.2);
      tl.fromTo(".line1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.2);
      tl.fromTo(".line2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.3);
      tl.fromTo("#copy-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 2.45);
      tl.fromTo("#name", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.45);

      // Hold: gentle movement, finite repeats, all ending before 5.0 s
      tl.to("#steam-group", { y: -8, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.9);
      tl.to(".orn", { opacity: 0.45, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.05 }, 2.9);
      tl.to("#panel", { scale: 1.015, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 2.9);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
