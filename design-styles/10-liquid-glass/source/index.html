<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "LG Inter";
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "LG Inter";
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: "LG Inter";
        src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }

      :root {
        --paper: #f3f2ee;
        --ink: #0b0c10;
        --orange: #ff5a1f;
        --pink: #ff2e7e;
        --mint: #2bd9a0;
        --violet: #8b5cff;
        --blue: #2e4bff;
        --rim: rgba(255, 255, 255, 0.78);
        --glass: rgba(255, 255, 255, 0.5);
        --shadow: 0 18px 46px rgba(11, 12, 16, 0.2);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        font-family: "LG Inter", "Inter", sans-serif;
        color: var(--ink);
      }

      /* Backdrop: soft colour pools behind the glass */
      .pool {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }
      #pool-orange {
        left: -260px;
        top: -300px;
        width: 1000px;
        height: 900px;
        background: radial-gradient(closest-side, rgba(255, 90, 31, 0.95), rgba(255, 90, 31, 0));
      }
      #pool-violet {
        left: 1280px;
        top: -330px;
        width: 960px;
        height: 820px;
        background: radial-gradient(closest-side, rgba(139, 92, 255, 0.85), rgba(139, 92, 255, 0));
      }
      #pool-blue {
        left: 760px;
        top: -260px;
        width: 620px;
        height: 480px;
        background: radial-gradient(closest-side, rgba(46, 75, 255, 0.7), rgba(46, 75, 255, 0));
      }
      #pool-pink {
        left: 820px;
        top: 620px;
        width: 1100px;
        height: 760px;
        background: radial-gradient(closest-side, rgba(255, 46, 126, 0.85), rgba(255, 46, 126, 0));
      }
      #pool-mint {
        left: 1380px;
        top: 560px;
        width: 900px;
        height: 760px;
        background: radial-gradient(closest-side, rgba(43, 217, 160, 0.9), rgba(43, 217, 160, 0));
      }

      /* Style label */
      #label {
        position: absolute;
        left: 72px;
        top: 64px;
        padding: 14px 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        box-shadow: inset 0 0 0 1.5px var(--rim), 0 10px 26px rgba(11, 12, 16, 0.14);
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.01em;
        line-height: 1;
        color: var(--ink);
      }

      /* Hero name */
      #hero {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #hero-name {
        font-size: 232px;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1;
        white-space: nowrap;
        color: var(--ink);
      }

      /* Magnifier lens: one glass droplet that bends what sits under its rim */
      #lens {
        position: absolute;
        left: 1170px;
        top: 310px;
        width: 460px;
        height: 460px;
        border-radius: 50%;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 18px 40px rgba(11, 12, 16, 0.12);
      }
      /* Rim: lit from top-left, darker on the far side, with a faint colour fringe */
      #lens::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        box-shadow:
          inset 0 0 0 2px var(--rim),
          inset 14px 18px 26px -6px rgba(255, 255, 255, 0.85),
          inset -18px -22px 34px -10px rgba(11, 12, 16, 0.22);
      }
      #lens::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        padding: 14px;
        background: conic-gradient(
          from -40deg,
          rgba(255, 46, 126, 0.55),
          rgba(255, 90, 31, 0.1),
          rgba(43, 217, 160, 0.55),
          rgba(46, 75, 255, 0.3),
          rgba(255, 46, 126, 0.55)
        );
        -webkit-mask: radial-gradient(closest-side, transparent 88%, #000 100%);
        mask: radial-gradient(closest-side, transparent 88%, #000 100%);
        z-index: 1;
      }

      /* Text panel: glass with frost, ink on 50% white */
      #panel {
        position: absolute;
        left: 120px;
        top: 330px;
        width: 820px;
        height: 420px;
        padding: 64px;
        border-radius: 48px;
        background: var(--glass);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        box-shadow:
          inset 0 0 0 1.5px var(--rim),
          inset 18px 22px 40px -18px rgba(255, 255, 255, 0.9),
          var(--shadow);
        overflow: hidden;
      }
      #sheen {
        position: absolute;
        top: -10%;
        left: 0;
        width: 60%;
        height: 120%;
        background: linear-gradient(
          100deg,
          rgba(255, 255, 255, 0) 30%,
          rgba(255, 255, 255, 0.55) 50%,
          rgba(255, 255, 255, 0) 70%
        );
        pointer-events: none;
      }
      #line {
        position: absolute;
        left: 64px;
        top: 64px;
        width: 692px;
        font-size: 92px;
        font-weight: 700;
        line-height: 1.04;
        letter-spacing: -0.04em;
        color: var(--ink);
      }
      #line span {
        display: block;
      }
      #brand {
        position: absolute;
        left: 64px;
        bottom: 58px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 44px;
        font-weight: 500;
        letter-spacing: 0.005em;
        color: var(--ink);
      }
      #brand i {
        display: block;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--orange);
        box-shadow: inset 4px 4px 6px rgba(255, 255, 255, 0.6);
      }

      /* Cup */
      #cup {
        position: absolute;
        left: 1040px;
        top: 180px;
        width: 640px;
        height: 640px;
      }
      #cup svg {
        display: block;
        width: 640px;
        height: 640px;
        overflow: visible;
      }
      #caustic {
        position: absolute;
        left: 1180px;
        top: 742px;
        width: 380px;
        height: 90px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0));
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="pool-orange" class="pool" data-layout-ignore data-layout-allow-overflow></div>
      <div id="pool-violet" class="pool" data-layout-ignore data-layout-allow-overflow></div>
      <div id="pool-blue" class="pool" data-layout-ignore data-layout-allow-overflow></div>
      <div id="pool-pink" class="pool" data-layout-ignore data-layout-allow-overflow></div>
      <div id="pool-mint" class="pool" data-layout-ignore data-layout-allow-overflow></div>

      <div id="label">Liquid Glass</div>

      <div id="hero">
        <div id="hero-name" data-layout-allow-overlap>Lantern Bean</div>
      </div>

      <div id="lens" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion></div>

      <div id="caustic"></div>

      <div id="cup">
        <svg viewBox="0 0 600 600" aria-hidden="true">
          <defs>
            <linearGradient id="coffee" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7a4a2c" />
              <stop offset="0.55" stop-color="#3f2415" />
              <stop offset="1" stop-color="#1d0f08" />
            </linearGradient>
            <linearGradient id="glassBody" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.5" />
              <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.12" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.38" />
            </linearGradient>
            <radialGradient id="saucerFill" cx="0.5" cy="0.4" r="0.6">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.7" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.22" />
            </radialGradient>
          </defs>

          <!-- steam, above the mouth -->
          <g id="steam" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.92">
            <path d="M236 206 C212 168 258 140 234 98 C222 76 240 60 236 44" />
            <path d="M300 200 C276 160 322 132 298 90 C286 68 304 52 300 34" />
            <path d="M364 206 C340 168 386 140 362 98 C350 76 368 60 364 44" />
          </g>

          <!-- saucer, centred under the body -->
          <ellipse cx="300" cy="482" rx="272" ry="46" fill="rgba(11,12,16,0.14)" />
          <ellipse cx="300" cy="476" rx="270" ry="40" fill="url(#saucerFill)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3" />
          <ellipse cx="300" cy="480" rx="176" ry="22" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" />

          <!-- handle, drawn first so the body overlaps its join -->
          <path d="M444 292 C532 270 556 396 444 414" fill="none" stroke="#2a160b" stroke-width="34" stroke-linecap="round" />
          <path d="M444 292 C532 270 556 396 444 414" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="30" stroke-linecap="round" />
          <path d="M444 292 C532 270 556 396 444 414" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="3" stroke-linecap="round" />

          <!-- body -->
          <path d="M150 250 L450 250 C450 380 410 468 300 468 C190 468 150 380 150 250 Z" fill="url(#coffee)" />
          <path d="M150 250 L450 250 C450 380 410 468 300 468 C190 468 150 380 150 250 Z" fill="url(#glassBody)" opacity="0.55" />
          <path d="M172 284 C176 360 204 420 246 440" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round" />
          <path d="M150 250 L450 250 C450 380 410 468 300 468 C190 468 150 380 150 250 Z" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3" />

          <!-- rim and coffee surface -->
          <ellipse cx="300" cy="250" rx="152" ry="36" fill="rgba(255,255,255,0.35)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" />
          <ellipse cx="300" cy="252" rx="138" ry="24" fill="#2a160b" fill-opacity="0.85" />
          <path d="M190 240 C214 226 250 220 280 226" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round" />
        </svg>
      </div>

      <div id="panel">
        <div id="line">
          <span>Fresh coffee,</span>
          <span>every morning</span>
        </div>
        <div id="brand"><i></i>Lantern Bean</div>
        <div id="sheen" data-layout-allow-overflow></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Backdrop drift (finite, deterministic)
      tl.to("#pool-pink", { x: 60, y: -40, duration: 5, ease: "sine.inOut" }, 0);
      tl.to("#pool-mint", { x: -70, y: 30, duration: 5, ease: "sine.inOut" }, 0);
      tl.to("#pool-violet", { x: -50, y: 40, duration: 5, ease: "sine.inOut" }, 0);

      // 0.0 - 1.8 s: hero name, magnifier lens
      tl.fromTo(
        "#hero-name",
        { y: 36, opacity: 0.9 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );
      // Glass lens passes across the word from left to right and has left the frame by 1.2 s.
      tl.fromTo("#lens", { x: -1100 }, { x: 900, duration: 1.0, ease: "power2.inOut" }, 0.2);
      tl.to("#hero-name", { y: -44, opacity: 0, duration: 0.42, ease: "power2.in" }, 1.46);

      // 1.8 - 2.8 s: cup and line arrive
      tl.fromTo(
        "#cup",
        { opacity: 0, scale: 0.84, y: 60 },
        { opacity: 1, scale: 1, y: 0, duration: 0.85, ease: "back.out(1.2)" },
        1.9
      );
      tl.fromTo(
        "#caustic",
        { opacity: 0, scale: 0.6 },
        { opacity: 0.9, scale: 1, duration: 0.8, ease: "power2.out" },
        2.0
      );
      tl.fromTo(
        "#panel",
        { opacity: 0, x: -40 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
        2.0
      );
      tl.fromTo(
        "#line span",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out", stagger: 0.12 },
        2.15
      );
      tl.fromTo(
        "#brand",
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        2.45
      );

      // 2.8 - 5.0 s: gentle movement only
      tl.to("#cup", { y: -10, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.8);
      tl.to("#steam path", { y: -12, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.12 }, 2.9);
      tl.fromTo(
        "#sheen",
        { x: -520 },
        { x: 860, duration: 1.3, ease: "power1.inOut" },
        3.3
      );
      tl.to("#caustic", { scaleX: 1.06, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.8);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
