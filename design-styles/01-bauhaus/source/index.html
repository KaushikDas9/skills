<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Jost";
        src: url("assets/jost-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Jost";
        src: url("assets/jost-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      :root {
        --paper: #f0e9da;
        --ink: #161514;
        --blue: #1f4fa3;
        --red: #db3a26;
        --yellow: #f2b419;
        --gray: #6e675e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--paper);
        font-family: "Jost", sans-serif;
        color: var(--ink);
        overflow: hidden;
      }
      .abs {
        position: absolute;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .mask {
        position: absolute;
        overflow: hidden;
        white-space: nowrap;
        line-height: 1;
      }
      .mask > div {
        display: inline-block;
        white-space: nowrap;
      }
      .hero {
        font-weight: 700;
        font-size: 190px;
        letter-spacing: -0.025em;
        line-height: 1;
      }
      .rule {
        position: absolute;
        background: var(--ink);
      }
      .label {
        position: absolute;
        left: 72px;
        top: 1000px;
        font-size: 30px;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: var(--ink);
      }
      .wipe {
        position: absolute;
        inset: 0;
        background: var(--red);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: 0.0 - 1.6 s, the shop name -->
      <div class="scene clip" data-start="0" data-duration="1.6" data-track-index="1">
        <div id="s1-square" class="abs" style="left:72px; top:72px; width:150px; height:150px; background:var(--red);"></div>
        <div id="s1-circle" class="abs" style="left:1340px; top:80px; width:440px; height:440px; border-radius:50%; background:var(--blue);"></div>
        <div id="s1-tri" data-layout-allow-overflow class="abs" style="left:1280px; top:560px; width:640px; height:520px; background:var(--yellow); clip-path:polygon(100% 0, 100% 100%, 0 100%);"></div>
        <div id="s1-rule" class="rule" style="left:120px; top:372px; width:1080px; height:16px;"></div>
        <div class="mask" style="left:120px; top:400px; height:220px;">
          <div id="s1-hero" class="hero">Lantern Bean</div>
        </div>
      </div>

      <!-- Scene 2: 1.6 - 3.4 s, the cup -->
      <div class="scene clip" data-start="1.6" data-duration="1.8" data-track-index="1">
        <div id="s2-cup" class="abs" style="left:1220px; top:300px; width:520px; height:520px;">
          <div id="s2-steam-a" class="abs" style="left:180px; top:110px; width:26px; height:26px; border-radius:50%; background:var(--blue);"></div>
          <div id="s2-steam-b" class="abs" style="left:247px; top:66px; width:26px; height:26px; border-radius:50%; background:var(--blue);"></div>
          <div id="s2-steam-c" class="abs" style="left:314px; top:110px; width:26px; height:26px; border-radius:50%; background:var(--blue);"></div>
          <div id="s2-handle" class="abs" style="left:350px; top:220px; width:120px; height:120px; border-radius:50%; border:26px solid var(--blue);"></div>
          <div id="s2-body" class="abs" style="left:110px; top:170px; width:300px; height:230px; background:var(--red); clip-path:polygon(0 0, 100% 0, 88% 100%, 12% 100%);"></div>
          <div id="s2-dot" class="abs" style="left:230px; top:250px; width:60px; height:60px; border-radius:50%; background:var(--yellow);"></div>
          <div id="s2-rim" class="abs" style="left:100px; top:150px; width:320px; height:30px; background:var(--ink);"></div>
          <div id="s2-saucer" class="abs" style="left:40px; top:400px; width:440px; height:26px; background:var(--ink);"></div>
        </div>
        <div id="s2-rule" class="rule" style="left:120px; top:400px; width:760px; height:14px;"></div>
        <div class="mask" style="left:120px; top:440px; height:180px;">
          <div id="s2-text" style="font-weight:700; font-size:80px; line-height:1;">Fresh coffee, every morning</div>
        </div>
      </div>

      <!-- Scene 3: 3.4 - 5.0 s, the call to action -->
      <div class="scene clip" data-start="3.4" data-duration="1.6" data-track-index="1">
        <div id="s3-circle" class="abs" style="left:1200px; top:360px; width:360px; height:360px; border-radius:50%; background:var(--yellow);"></div>
        <div id="s3-square" data-layout-allow-overflow class="abs" style="left:1380px; top:540px; width:540px; height:540px; background:var(--red);"></div>
        <div class="mask" style="left:120px; top:280px; height:230px;">
          <div id="s3-head" class="hero" style="font-size:132px;">Come in, warm up.</div>
        </div>
        <div id="s3-rule" class="rule" style="left:120px; top:470px; width:700px; height:14px;"></div>
        <div id="s3-name" class="abs" style="left:120px; top:510px; font-weight:700; font-size:72px; line-height:1; color:var(--blue);">Lantern Bean</div>
      </div>

      <!-- Transition wipes (red bars) -->
      <div class="clip" data-start="1.3" data-duration="0.6" data-track-index="2">
        <div id="w1" class="wipe"></div>
      </div>
      <div class="clip" data-start="3.1" data-duration="0.6" data-track-index="2">
        <div id="w2" class="wipe"></div>
      </div>

      <!-- Style label, whole video -->
      <div class="label clip" data-start="0" data-duration="5" data-track-index="3">Bauhaus</div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Scene 1
      tl.fromTo("#s1-rule", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.05);
      tl.fromTo("#s1-hero", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "power4.out" }, 0);
      tl.fromTo("#s1-circle", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#s1-tri", { yPercent: 30 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, 0.15);

      // Wipe 1: covers at 1.3-1.6, uncovers 1.6-1.9
      tl.fromTo("#w1", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power3.in" }, 1.3);
      tl.set("#w1", { transformOrigin: "100% 50%" }, 1.6);
      tl.to("#w1", { scaleX: 0, duration: 0.3, ease: "power3.out" }, 1.6);

      // Scene 2
      tl.fromTo("#s2-cup", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.65);
      tl.fromTo("#s2-saucer", { scaleX: 0, transformOrigin: "50% 50%" }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 1.7);
      tl.fromTo(["#s2-steam-a", "#s2-steam-b", "#s2-steam-c"], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.08 }, 2.0);
      tl.fromTo("#s2-rule", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 1.9);
      tl.fromTo("#s2-text", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "power4.out" }, 2.0);

      // Wipe 2: covers at 3.1-3.4, uncovers 3.4-3.7
      tl.fromTo("#w2", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power3.in" }, 3.1);
      tl.set("#w2", { transformOrigin: "100% 50%" }, 3.4);
      tl.to("#w2", { scaleX: 0, duration: 0.3, ease: "power3.out" }, 3.4);

      // Scene 3 (finished by 4.4 s, then held)
      tl.fromTo("#s3-circle", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 3.45);
      tl.fromTo("#s3-square", { x: 200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 3.5);
      tl.fromTo("#s3-head", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "power4.out" }, 3.55);
      tl.fromTo("#s3-rule", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 3.95);
      tl.fromTo("#s3-name", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 4.0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
